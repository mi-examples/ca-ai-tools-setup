name: Release private package

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: package-release

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://npm.pkg.github.com
          scope: '@metricinsights'
          cache: npm

      - name: Verify tag matches package version
        run: >-
          node -e 'const p=require("./package.json");
          if (process.env.GITHUB_REF_NAME !== "v" + p.version) {
          console.error("Tag " + process.env.GITHUB_REF_NAME + " does not match package version " + p.version);
          process.exit(1); }'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Test packed artifact
        run: npm run test:package

      - name: Select release channel
        id: channel
        run: >-
          node -e 'const p=require("./package.json");
          require("fs").appendFileSync(
          process.env.GITHUB_OUTPUT,
          "tag=" + (p.version.includes("-") ? "next" : "stable") + "\n");'

      - name: Publish
        run: npm publish --tag "${{ steps.channel.outputs.tag }}"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.METRICINSIGHTS_PACKAGES_TOKEN }}
